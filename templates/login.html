<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de cadastro e emissão de carteirinhas digitais da associação." />
  <title>CadasTrans — Entrar</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
  />
</head>
<body>
  <main class="container" style="max-width: 480px; padding-top: 3rem;">
    <hgroup>
      <h1>🏳️‍⚧️ CadasTrans</h1>
      <p>Carteirinha digital da associação Transbordamos. Destinada somente a pessoas Trans. Informe seus dados para acessar ou iniciar seu cadastro.</p>
    </hgroup>

    <article>
      <form method="POST" action="/consultar" novalidate>
        <label for="cpf">
          CPF
          <input
            type="text"
            id="cpf"
            name="cpf"
            inputmode="numeric"
            placeholder="000.000.000-00"
            maxlength="14"
            required
            autocomplete="off"
            oninput="mascaraCPF(this)"
          />
          <small>Apenas números.</small>
        </label>

        <label for="data_nascimento">
          Data de nascimento
          <input
            type="date"
            id="data_nascimento"
            name="data_nascimento"
            required
          />
        </label>

        <button type="submit" class="contrast">Consultar meu cadastro</button>
      </form>
    </article>

    <footer>
      <small>
        Não possui cadastro? Ao consultar, você será direcionado(a/e) para o formulário automaticamente.
      </small>
    </footer>
  </main>
  <script>
    function mascaraCPF(input) {
      // 1. Remove tudo que não for dígito (0-9)
      let v = input.value.replace(/\D/g, ''); 
      
      // 2. Trava o tamanho máximo em 11 dígitos puros
      if (v.length > 11) {
        v = v.substring(0, 11);
      }

      // 3. Aplica a formatação usando grupos de Regex
      v = v.replace(/(\d{3})(\d)/, '$1.$2');       // Coloca o primeiro ponto
      v = v.replace(/(\d{3})(\d)/, '$1.$2');       // Coloca o segundo ponto
      v = v.replace(/(\d{3})(\d{1,2})$/, '$1-$2'); // Coloca o traço

      // 4. Atualiza o valor do campo na tela
      input.value = v;
    }
  </script>
</body>
</html>
