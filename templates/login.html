<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistema de cadastro e emissão de carteirinhas digitais da associação." />
  <title>CadasTranspass — Entrar</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
  />
</head>
<body>
  <main class="container" style="max-width: 480px; padding-top: 3rem;">
    <hgroup>
      <h1>🏳️‍⚧️ CadasTranspass</h1>
      <p>Carteirinha digital da associação. Informe seus dados para acessar ou iniciar seu cadastro.</p>
    </hgroup>

    <article>
      <form method="POST" action="/consultar" novalidate>
        <label for="cpf">
          CPF
          <input
            type="text"
            id="cpf"
            name="cpf"
            inputmode="numeric"
            placeholder="000.000.000-00"
            maxlength="14"
            required
            autocomplete="off"
          />
          <small>Apenas números (pontos e traço são opcionais).</small>
        </label>

        <label for="data_nascimento">
          Data de nascimento
          <input
            type="date"
            id="data_nascimento"
            name="data_nascimento"
            required
          />
        </label>

        <button type="submit" class="contrast">Consultar meu cadastro</button>
      </form>
    </article>

    <footer>
      <small>
        Não possui cadastro? Ao consultar, você será direcionado(a/e) para o formulário automaticamente.
      </small>
    </footer>
  </main>
</body>
</html>
